name: Validate Plugin Package

on:
  push:
    branches: [master, main]
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'
      # v2.2.0：Vendor core anti-drift (V1-V6) step 跑的是 tests/test_vendor_core.py，
      # 只改 tests/ 若不在 paths 里则 CI 根本不触发，等于该门禁形同虚设。
      - 'tests/**'
      # 同理：Vendor core anti-drift (V1-V6) 校验的是 vendor/shared-core/ 下的
      # VENDOR.json 与 assemble_spawn_prompt.py，只改 vendor 也必须触发 CI。
      - 'vendor/**'
      - 'docs/**'
      - 'avatars/**'
      - '.codebuddy-plugin/**'
      - '.claude-plugin/**'
      - '.github/workflows/validate.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      # CONTRIBUTING.md 同属随发布变动的顶层文档（README.md / CHANGELOG.md 已
      # 在列），漏掉会导致改它不触发 CI。
      - 'CONTRIBUTING.md'
      - 'settings.json'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Plugin Package
    runs-on: ubuntu-latest
    # v2.4.0：五套 mutation-based selftest 会在临时目录反复复制整个包体
    # （manifest 26 条 / harness 14 条 / routing 12 条），本机实测合计约 350s
    # IO（近 6 分钟）；本轮又新增 protocol 13 条 + phase_norm 26 条共 39 条
    # 负例，时长还会上升。CI 共享 runner 需另留 checkout / setup 与波动余量，
    # 原 15 分钟偏紧，提到 25。
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 单一事实来源：双 manifest 对等 / agents 与头像资产完整性 /
      # teamInfo 自洽 / README 版本一致 / 废弃表述扫描。
      # 废弃术语清单只维护在 scripts/manifest_check.py 的 FORBIDDEN_PATTERNS 中，
      # 请勿在本 workflow 里另抄一份：历史上正是因为抄了一份「精确串」清单，
      # 某个在关键词中间插了字的旧表述逃过匹配，造成了假绿。
      - name: Package consistency check
        run: python3 scripts/manifest_check.py

      # 注入式负例：证明上面的校验器「真的在检查」，而不是永远返回 0。
      # 仅测正向（干净仓库 rc=0）无法区分这两者 —— 这是本项目历史上假绿的成因。
      - name: Checker self-test (mutation-based negative cases)
        run: python3 scripts/manifest_check_selftest.py

      - name: Protocol compliance tests
        run: |
          cd skills/research-orchestration-workflow/scripts
          python3 protocol_check.py envelope
          python3 protocol_check.py conflict
          python3 protocol_check.py integration

      # 协议门禁的注入式负例：证明 protocol_check.py 的三个 suite 真会拦截破坏
      # 而非永远返回 0。v2.4.0 起纳入 CI。
      # 脚本内部按 __file__ 解析自身与校验器位置，不依赖 working-directory，
      # 故无需像上方 Protocol compliance tests 那样先 cd。
      - name: Protocol checker self-test (mutation-based)
        run: python3 skills/research-orchestration-workflow/scripts/protocol_check_selftest.py

      # 阶段名归一化 shim 的自测：8 阶段名 × 2 种写法 + 大小写 + 整数 + 非法值
      # 的映射与透传行为必须正确，否则 spawn 装配第一步按官方文档执行必然失败。
      # 同样按 __file__ 解析包根，不依赖 working-directory。
      - name: Phase normalization self-test
        run: python3 scripts/test_phase_normalization.py

      # v2.1.2 起 CI 纳入 Harness Engineering 12 项设计检查 + 注入式负例
      # （v2.2.0 为 14 条：N1-N13 + R1）。此前仅本地手动跑，改一行文档即可
      # 无声破坏（Step 4 对标发现的执行层缺口）。
      - name: Harness design checks (H1-H12)
        run: python3 scripts/harness_eval.py

      - name: Harness eval self-test (mutation-based)
        run: python3 scripts/harness_eval_selftest.py

      # 成员集合 / 触发词 / 条目结构 / 工具名形态 / 工具集合双向相等 / 真实 MCP 清单对照（R1-R6），
      # 防「文档加了成员但 MD/manifest 没同步」「MD 工具名漂移或伪造」的假绿。
      # R6 需要真实 MCP 清单，CI / git-clone 态不可得时显式 SKIP 且不计 FAIL。
      - name: Routing consistency check (R1-R6)
        run: python3 scripts/routing_eval.py

      # 注入式负例证明 R1-R6 真会拦截破坏而非永远返回 0，防门禁退化成假绿。
      - name: Routing eval self-test (mutation-based)
        run: python3 scripts/routing_eval_selftest.py

      # vendor 副本与联邦真源哈希比对 + git clone 冒烟，防 shared-core 静默漂移。
      - name: Vendor core anti-drift (V1-V6)
        run: python3 tests/test_vendor_core.py

      # v2.2.0 P0-2 的状态持久化工具此前完全没有 CI 覆盖，只靠本地手测。
      # 跑一次完整八阶段 + 8 检查点 + 断点续跑 + 预算 + finish，确保协议 §3
      # 的确定性工程层不会在「只改 skills/」的情况下静默坏掉。
      - name: State IO lifecycle smoke test (v2.2.0)
        run: |
          set -e
          S=skills/research-orchestration-workflow/scripts/state_io.py
          W=$(mktemp -d)
          python3 "$S" init --task-id ci-smoke --workspace "$W" >/dev/null
          i=1
          for P in FREEZE IDENTIFY COLLAPSE CLARIFY ALIGN EXECUTE REVIEW NEXT; do
            CP=$(printf 'cp-%03d' "$i")
            python3 "$S" advance --task-id ci-smoke --workspace "$W" \
              --phase "$P" --checkpoint "$CP" --note "CI $P" >/dev/null
            i=$((i + 1))
          done
          python3 "$S" resume --task-id ci-smoke --workspace "$W"
          python3 "$S" budget --task-id ci-smoke --workspace "$W" --turns 8 --tokens 8000
          python3 "$S" finish --task-id ci-smoke --workspace "$W"
          test -f "$W/.harness-runs/ci-smoke/_state.json"
          N=$(find "$W/.harness-runs/ci-smoke/checkpoints" -name 'cp-*.md' | wc -l | tr -d ' ')
          test "$N" -eq 8
          echo "✅ state_io 八阶段 + 8 检查点 + 断点续跑 + 预算 + finish 全链路通过"

      # R2 P1-3：v2.4.0 的 fail 子命令与熔断（circuit breaker）此前只在本地手测过，
      # CI 只走 happy path——熔断逻辑被改坏时 CI 不会红。本段锁定四条语义：
      # ① fail x5 达阈值 → status=aborted + abort_reason=circuit_breaker
      # ② 熔断后 advance 拒绝（rc!=0）  ③ finish 仍 rc=0 且不改写 aborted
      # ④ 四项上限语义分层（tests/test_state_ceilings.py：turns/tokens=告警，
      #    max_time/failures=终态——防「告警被误改成截断」或反向漂移）。
      - name: State IO circuit breaker + ceiling semantics (R2)
        run: |
          set -e
          S=skills/research-orchestration-workflow/scripts/state_io.py
          W=$(mktemp -d)
          python3 "$S" init --task-id ci-cb --workspace "$W" >/dev/null
          for i in 1 2 3 4 5; do
            python3 "$S" fail --task-id ci-cb --workspace "$W" --reason "fail-$i" >/dev/null
          done
          ST="$W/.harness-runs/ci-cb/_state.json"
          python3 - "$ST" <<'PYEOF'
          import json, sys
          st = json.load(open(sys.argv[1]))
          assert st["status"] == "aborted", f'期望 aborted，实得 {st["status"]}'
          assert st["abort_reason"] == "circuit_breaker", f'期望 circuit_breaker，实得 {st["abort_reason"]}'
          print("✅ fail x5 → 熔断终态（status=aborted, reason=circuit_breaker）")
          PYEOF
          set +e
          python3 "$S" advance --task-id ci-cb --workspace "$W" \
            --phase FREEZE --checkpoint cp-001 --note post-abort >/dev/null 2>&1
          RC_A=$?
          set -e
          if [ "$RC_A" -eq 0 ]; then
            echo "❌ 熔断后 advance 被放行（应拒绝 rc!=0）"; exit 1
          fi
          echo "✅ 熔断后 advance 拒绝（rc=$RC_A）"
          set +e
          python3 "$S" finish --task-id ci-cb --workspace "$W" >/dev/null 2>&1
          RC_F=$?
          set -e
          if [ "$RC_F" -ne 0 ]; then
            echo "❌ 熔断后 finish 应仍 rc=0（归档收尾允许），实际 rc=$RC_F"; exit 1
          fi
          python3 - "$ST" <<'PYEOF'
          import json, sys
          st = json.load(open(sys.argv[1]))
          assert st["status"] == "aborted", "finish 不得改写熔断终态"
          print("✅ 熔断后 finish rc=0 且 status 仍 aborted（熔断信号未被抹掉）")
          PYEOF

      # R2 P0-1：四项硬上限的语义分层锁定（告警 vs 终态）
      - name: State IO ceiling semantics lock (R2 P0-1)
        run: python3 tests/test_state_ceilings.py

      # R3 P0-1 / P1-2：checkpoint 形态归一化 + task_id 消毒的输入护栏。
      # 10 条用例（含「不带检查点的推进」回归护栏），逐条独立取 rc，
      # 负例同时断言失败原因归属被测分支；3 组注入破坏证明护栏会红。
      - name: State IO input guards (R3 P0-1/P1-2)
        run: python3 tests/test_state_io_guards.py

      # R5-E4：主理人事实源一致性（C12 × C13 组合态盲区修复）。
      # M1-M6 六条用例锁定「声明位 = 唯一事实源」语义：合法换主理人（全同步）
      # 放行，任何单字段漂移红且失败文案归属被测门禁。
      - name: Lead source-of-truth consistency (R5 E4)
        run: python3 tests/test_lead_source_of_truth.py

      # R6 P0-1 / P0-2 / P1-1：运行时序 / 终态污染 / 观测数据一致性。
      # 8 条用例锁定三处修复：done 终态不得被事后超时翻案（resume/budget
      # 改写终态）、fail 不得抬高熔断阈值（绕过熔断）、advance 不得冲掉
      # 主理人上报的观测值。负例同时断言失败原因归属被测分支。
      - name: State IO runtime sequencing + terminal state (R6)
        run: python3 tests/test_state_runtime_sequencing.py


      - name: Topic scoring edge cases
        run: |
          set +e  # GitHub Actions bash -e 默认开启，关掉避免 Python rc=1 终止 step
          cd skills/research-orchestration-workflow/scripts
          # 越界必须 rc=1
          python3 topic_scoring.py --topic bad --originality 11 --feasibility 7 \
            --value-density 9 --data-availability 7 --competition 6 \
            --cognition 8 --resource-fit 7 --sustainability 7
          rc=$?
          if [ $rc -ne 1 ]; then
            echo "❌ 越界应退出码 1，实际 rc=$rc"
            exit 1
          fi
          echo "✅ 越界输入被正确拒绝 (rc=1)"

          # 缺维必须 rc=2（argparse 错误）
          python3 topic_scoring.py --topic miss --originality 8
          rc=$?
          if [ $rc -ne 2 ]; then
            echo "❌ 缺维应退出码 2，实际 rc=$rc"
            exit 1
          fi
          echo "✅ 缺维被正确拒绝 (rc=2)"

          # 正常态阳性用例：只在两个错误路径上断言，无法发现「校验器退化成对
          # 任何输入都拒绝」，故补一条合法输入必须 rc=0。
          python3 topic_scoring.py --topic healthy --originality 8 --feasibility 7 \
            --value-density 9 --data-availability 7 --competition 6 \
            --cognition 8 --resource-fit 7 --sustainability 7 >/dev/null 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "❌ 正常输入应退出码 0，实际 rc=$rc"
            exit 1
          fi
          echo "✅ 正常输入被正确接受 (rc=0)"
